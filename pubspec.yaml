name: slab_stack
description: High-performance Pokémon TCG tracking app with multi-regional pricing and slab management.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^14.2.7

  # Local caching (offline-first)
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.5.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  flutter_staggered_grid_view: ^0.7.0
  share_plus: ^13.0.0

  # Utilities
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0

dependency_overrides:
  # win32 6.x requires a C compiler (MSVC/MinGW) via native build hooks.
  # Pin to 5.x which has no native hook — sufficient for web-only targeting.
  win32: '>=5.0.0 <6.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
